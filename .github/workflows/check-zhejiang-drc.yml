name: Check Zhejiang DRC connectivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-zhejiang-drc.yml
      - scripts/probe-zhejiang-drc.mjs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Request official list and announcement from the GitHub runner
        run: node scripts/probe-zhejiang-drc.mjs
