name: Check Zhejiang DRC connectivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-zhejiang-drc.yml
      - scripts/probe-zhejiang-drc.mjs

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.label }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: api
            label: official listing API
          - target: column
            label: official oil-price page
          - target: announcement
            label: 2026-09-24 official announcement
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Request selected official source from the GitHub runner
        run: node scripts/probe-zhejiang-drc.mjs ${{ matrix.target }}
